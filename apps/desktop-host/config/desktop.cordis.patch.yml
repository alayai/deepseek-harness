# Electron reuses the browser composition without its network and browser-launch rows.
# webserver stays mounted with listen: false so plugin HTTP routes (icons, APIs)
# still register; desktop-host dispatches them over dsh-app:// with no TCP port.

- id: web-startup
  disabled: true

- id: webserver
  inject: []
  config:
    listen: false
    host: 127.0.0.1
    port: 0

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
